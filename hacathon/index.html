<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveSetu | RTO Portal</title>
    <link rel="stylesheet" href="style.css?v=20260823_0740">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="app"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        (function() {
            try {
                var rawApps = localStorage.getItem('drivesetu_applications');
                var rawRev = localStorage.getItem('drivesetu_pending_reviews');
                if ((rawApps && (rawApps.indexOf('APP-DEMO-001') !== -1 || rawApps.indexOf('LL-SUFYAN-001') !== -1 || rawApps.indexOf('Rahul') !== -1 || rawApps.indexOf('APP-102') !== -1)) ||
                    (rawRev && (rawRev.indexOf('APP-DEMO-001') !== -1 || rawRev.indexOf('APP-102') !== -1))) {
                    localStorage.removeItem('drivesetu_applications');
                    localStorage.removeItem('drivesetu_pending_reviews');
                    localStorage.removeItem('drivesetu_audit_log');
                }
            } catch(e) {}
        })();
    </script>
    <script src="supabaseClient.js?v=20260823_1010"></script>
    <script src="app.js?v=20260823_1010"></script>
</body>
</html>
